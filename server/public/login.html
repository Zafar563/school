<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qo'ng'iroq tizimi</title>
<link rel="stylesheet" href="/css/style.css">
<script>
  (function() {
    const saved = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body class="login-body">
  <div style="position:fixed; top:20px; right:20px; z-index:10;">
    <button class="theme-toggle-btn" id="loginThemeToggleBtn" title="Tungi / Kunduzgi rejim" type="button">
      <svg id="loginThemeIconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg id="loginThemeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>
  <div class="login-wrap">
    <div class="login-mark">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <div class="login-brand-text">
        <span class="login-brand-main" id="brandSchoolName">Maktab</span>
        <span class="login-brand-sub">Qo'ng'iroq boshqaruv tizimi</span>
      </div>
    </div>

    <div class="login-card">
      <form id="loginForm">
        <div class="field-group">
          <label for="username">Login</label>
          <input type="text" id="username" autocomplete="username" placeholder="Loginni kiriting" required>
        </div>
        <div class="field-group">
          <label for="password">Parol</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="Parolni kiriting" required>
        </div>
        <button type="submit" id="loginBtn">Kirish</button>
        <div class="error" id="errBox"></div>
      </form>
    </div>
  </div>

<script>
fetch('/api/branding').then(r => r.json()).then(d => {
  if (d.schoolName) {
    document.getElementById('brandSchoolName').textContent = d.schoolName;
    document.title = d.schoolName + " — Qo'ng'iroq tizimi";
  }
}).catch(() => {});

const form = document.getElementById('loginForm');
const errBox = document.getElementById('errBox');
const btn = document.getElementById('loginBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Tekshirilmoqda...';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) {
      errBox.textContent = data.error || 'Xatolik yuz berdi';
      btn.disabled = false;
      btn.textContent = 'Kirish';
      return;
    }
    window.location.href = '/dashboard.html';
  } catch (err) {
    errBox.textContent = 'Serverga ulanib bo\'lmadi';
    btn.disabled = false;
    btn.textContent = 'Kirish';
  }
});

// Theme toggle
const themeBtn = document.getElementById('loginThemeToggleBtn');
const sunIcon = document.getElementById('loginThemeIconSun');
const moonIcon = document.getElementById('loginThemeIconMoon');

function updateIcons(theme) {
  if (theme === 'dark') {
    if (sunIcon) sunIcon.style.display = 'block';
    if (moonIcon) moonIcon.style.display = 'none';
  } else {
    if (sunIcon) sunIcon.style.display = 'none';
    if (moonIcon) moonIcon.style.display = 'block';
  }
}

updateIcons(document.documentElement.getAttribute('data-theme') || 'light');

if (themeBtn) {
  themeBtn.onclick = () => {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    updateIcons(next);
  };
}
</script>
</body>
</html>
