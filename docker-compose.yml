services:
  db:
    image: postgres:16-alpine
    container_name: maktab-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maktab_db}
      POSTGRES_USER: ${POSTGRES_USER:-maktab_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maktab_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maktab_user} -d ${POSTGRES_DB:-maktab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/zafar563/school:latest
    container_name: maktab-qongirogi
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-maktab_user}:${POSTGRES_PASSWORD:-maktab_secure_pass_2026}@db:5432/${POSTGRES_DB:-maktab_db}}
      SESSION_SECRET: ${SESSION_SECRET:-super_secret_session_key_maktab_2026}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}

volumes:
  postgres_data:
    driver: local
