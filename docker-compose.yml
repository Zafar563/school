version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: maktab-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_bell}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-school_bell}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/zafar563/school:latest
    container_name: maktab-qongirogi
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret_pass}@db:5432/${POSTGRES_DB:-school_bell}}
      SESSION_SECRET: ${SESSION_SECRET:-change_this_session_secret_key_123}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}

volumes:
  postgres_data:
    driver: local
