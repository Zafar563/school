name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout kodni olish
        uses: actions/checkout@v4

      - name: GitHub Container Registry ga login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image yasash va push qilish
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ghcr.io/zafar563/school:latest

      - name: docker-compose.yml faylini VPS ga yuklash
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/maktab"

      - name: VPS da PostgreSQL va App konteynerlarini yangilash
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # .env faylini saqlash yoki mavjudini saqlab qolish
            if [ -n "${{ secrets.VPS_ENV }}" ]; then
              echo "${{ secrets.VPS_ENV }}" > /opt/maktab/.env
            elif [ ! -f /opt/maktab/.env ] || [ ! -s /opt/maktab/.env ]; then
              cat << 'EOF' > /opt/maktab/.env
PORT=3000
DATABASE_URL=postgresql://maktab_user:maktab_secure_pass_2026@db:5432/maktab_db
SESSION_SECRET=super_secret_session_key_maktab_2026
POSTGRES_USER=maktab_user
POSTGRES_PASSWORD=maktab_secure_pass_2026
POSTGRES_DB=maktab_db
POSTGRES_HOST=db
POSTGRES_PORT=5432
EOF
            fi

            # GHCR dan yangi imijni olish uchun login
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Docker Compose buyrug'ini aniqlash (v2 yoki v1)
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            echo "📦 Docker Compose orqali yangilanmoqda ($DC)..."
            $DC -f /opt/maktab/docker-compose.yml pull app || true
            $DC -f /opt/maktab/docker-compose.yml up -d --remove-orphans

            # Eski keraksiz imijlarni tozalash
            docker image prune -f || true

            echo "✅ PostgreSQL va Maktab Qo'ng'irog'i muvaffaqiyatli ishga tushdi!"
