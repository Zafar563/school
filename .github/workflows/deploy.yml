name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodni olish
        uses: actions/checkout@v4

      - name: Docker Hub ga login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image yasash va push qilish
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/school:latest

      - name: VPS ga deploy qilish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Docker o'rnatilganligini tekshirish
            docker --version

            # Papka yaratish (birinchi marta)
            mkdir -p /opt/maktab/data

            # .env faylini yangilash
            echo "${{ secrets.VPS_ENV }}" > /opt/maktab/.env

            # Yangi image ni tortib olish
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/school:latest

            # Eski konteynerni to'xtatish va yangi ishga tushirish
            docker stop maktab-qongirogi || true
            docker rm maktab-qongirogi || true

            docker run -d \
              --name maktab-qongirogi \
              --restart always \
              -p 3000:3000 \
              -v /opt/maktab/data:/app/data \
              --env-file /opt/maktab/.env \
              ghcr.io/${{ github.repository_owner }}/school:latest

            echo "✅ Deploy muvaffaqiyatli!"
